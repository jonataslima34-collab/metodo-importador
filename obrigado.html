<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falta 1 passo — Fórmula da Importação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d;
    --bg2:#161616;
    --bg3:#1f1f1f;
    --accent:#f5a623;
    --accent2:#ff7a1a;
    --white:#ffffff;
    --text-sec:rgba(255,255,255,.65);
    --text-faint:rgba(255,255,255,.4);
    --border:rgba(255,255,255,.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 50% 0%, rgba(245,166,35,.14), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, #060608 100%);
    color:var(--white);
    font-family:'Poppins', sans-serif;
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    text-align:center;
  }
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:520px;width:100%;}

  /* Logo */
  .logo{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-weight:800;font-size:22px;letter-spacing:.02em;margin-bottom:36px;
  }
  .logo .mark{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,#f9c04c,var(--accent2));
    display:inline-block;
  }

  /* Progress badge */
  .progress-badge{
    display:inline-flex;align-items:center;
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:30px;
    padding:5px;
    margin-bottom:32px;
    max-width:340px;
    width:100%;
  }
  .progress-badge .fill{
    background:linear-gradient(90deg,#f9c04c,var(--accent) 55%,var(--accent2));
    color:#151005;
    font-weight:700;
    font-size:12px;
    letter-spacing:.02em;
    padding:8px 16px;
    border-radius:24px;
    white-space:nowrap;
  }
  .progress-badge .empty{flex:1;height:8px;}

  h1{
    font-weight:800;
    font-size:28px;
    letter-spacing:-.01em;
    color:var(--accent);
    margin-bottom:18px;
    line-height:1.3;
  }
  h1 .dots{color:var(--white);}

  .instructions{
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--text-sec);
    max-width:380px;
    margin:0 auto 30px;
    line-height:1.6;
  }

  .btn{
    display:inline-block;
    background:linear-gradient(90deg,#f9c04c,var(--accent) 55%,var(--accent2));
    color:#151005;
    font-weight:800;
    font-size:16px;
    padding:18px 40px;
    border-radius:40px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    font-family:inherit;
    box-shadow:0 10px 30px rgba(245,166,35,.3);
    margin-bottom:34px;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05);}

  .info-box{
    background:rgba(245,166,35,.08);
    border:1px solid rgba(245,166,35,.22);
    border-radius:14px;
    padding:18px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
  }
  .info-box .row{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    color:var(--text-sec);
    font-weight:500;
  }
  .info-box .row strong{color:var(--white);font-weight:700;}
  .info-box .icon{
    width:34px;height:34px;flex-shrink:0;
    background:var(--bg3);
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }

  @media (max-width:480px){
    h1{font-size:23px;}
    .logo{font-size:19px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo"><span class="mark"></span> FÓRMULA DA IMPORTAÇÃO</div>

  <div class="progress-badge">
    <span class="fill">Inscrição quase concluída...</span>
    <span class="empty"></span>
  </div>

  <h1>Falta apenas 1 passo<span class="dots">...</span></h1>

  <p class="instructions">Clique no botão laranja e entre<br>no grupo do WhatsApp.</p>

  <a href="https://chat.whatsapp.com/Lj4iXTPHv4r8orcTfCzg9E" class="btn" target="_blank" rel="noopener">Entrar No Grupo Agora</a>

  <div class="info-box">
    <div class="row">
      <span class="icon">📅</span>
      <span>No dia <strong>17 de Agosto (Segunda-feira)</strong>, às <strong>12h</strong></span>
    </div>
    <div class="row">
      <span class="icon">💻</span>
      <span>Encontro <strong>exclusivo</strong> no Meet, vagas limitadas para <strong>100 pessoas</strong></span>
    </div>
  </div>
</div>

</body>
</html>
